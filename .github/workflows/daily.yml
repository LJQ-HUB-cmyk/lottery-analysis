name: Daily Lottery Analysis

on:
  schedule:
    # 每天 14:30 UTC (22:30 CST) 运行
    - cron: '30 14 * * *'
  workflow_dispatch:  # 支持手动触发

jobs:
  run-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily analysis
        env:
          PYTHONUTF8: '1'
        run: |
          python run_daily.py --strategy all --top-k 30

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Upload predictions
        uses: actions/upload-artifact@v4
        with:
          name: predictions
          path: output/predictions/

      - name: Upload charts
        uses: actions/upload-artifact@v4
        with:
          name: charts
          path: output/charts/
