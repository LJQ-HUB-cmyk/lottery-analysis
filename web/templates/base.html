<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}彩票分析{% endblock %}</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
  --text: #e2e8f0; --text2: #94a3b8; --text3: #64748b;
  --blue: #38bdf8; --green: #34d399; --red: #ef4444;
  --yellow: #fbbf24; --purple: #a78bfa;
  --radius: 10px;
}
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }

/* 导航 */
nav { background: var(--bg2); border-bottom: 1px solid var(--bg3); padding: 0 20px; display: flex; align-items: center; height: 50px; position: sticky; top: 0; z-index: 100; }
nav .logo { font-size: 18px; font-weight: bold; color: var(--blue); margin-right: 30px; }
nav a { color: var(--text2); padding: 14px 16px; font-size: 14px; border-bottom: 2px solid transparent; transition: all 0.2s; }
nav a:hover, nav a.active { color: var(--text); border-bottom-color: var(--blue); text-decoration: none; }

/* 布局 */
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

/* 卡片 */
.card { background: var(--bg2); border-radius: var(--radius); padding: 20px; }
.card h2 { font-size: 16px; color: var(--blue); margin-bottom: 15px; border-bottom: 1px solid var(--bg3); padding-bottom: 8px; }
.card h3 { font-size: 14px; color: var(--text2); margin-bottom: 10px; }

/* 统计卡片 */
.stat-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
@media (max-width: 900px) { .stat-cards { grid-template-columns: repeat(2, 1fr); } }
.stat-card { background: var(--bg2); border-radius: var(--radius); padding: 15px; text-align: center; }
.stat-card .label { font-size: 12px; color: var(--text3); }
.stat-card .value { font-size: 28px; font-weight: bold; margin: 5px 0; }
.stat-card .value.green { color: var(--green); }
.stat-card .value.red { color: var(--red); }
.stat-card .value.blue { color: var(--blue); }
.stat-card .value.yellow { color: var(--yellow); }

/* 表格 */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { background: var(--bg3); color: var(--text2); padding: 8px 10px; text-align: center; font-weight: normal; }
td { padding: 7px 10px; text-align: center; border-bottom: 1px solid var(--bg); }
tr:hover { background: var(--bg3); }
.num { font-weight: bold; color: var(--yellow); font-size: 15px; }
.score { color: var(--green); font-weight: bold; }
.hit { color: var(--green); }
.miss { color: var(--text3); }

/* 开奖号码 */
.draw-numbers { display: flex; justify-content: center; gap: 10px; margin: 15px 0; }
.draw-numbers span { background: var(--red); color: white; width: 48px; height: 48px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; }

/* KL8 球 */
.kl8-ball { display: inline-block; background: var(--purple); color: white; width: 32px; height: 32px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; margin: 2px; }
.kl8-play4 { background: #7c3aed; width: 36px; height: 36px; font-size: 14px; }

/* 图表容器 */
.chart { width: 100%; height: 350px; }
.chart-sm { width: 100%; height: 250px; }

/* 空状态 */
.empty { color: var(--text3); font-style: italic; padding: 30px; text-align: center; }

/* 页脚 */
.footer { text-align: center; color: var(--text3); font-size: 12px; padding: 30px 0 10px; }
</style>
</head>
<body>
<nav>
  <span class="logo">📊 彩票分析</span>
  <a href="/" class="{% if active == 'home' %}active{% endif %}">首页</a>
  <a href="/lottery/pls" class="{% if active == 'pls' %}active{% endif %}">排列三</a>
  <a href="/lottery/d3" class="{% if active == 'd3' %}active{% endif %}">福彩3D</a>
  <a href="/kl8" class="{% if active == 'kl8' %}active{% endif %}">快乐8</a>
  <a href="/backtest" class="{% if active == 'backtest' %}active{% endif %}">回测中心</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
<div class="footer">⚠️ 彩票具有随机性，以上仅供数据分析参考，不构成投注建议。</div>
</body>
</html>
