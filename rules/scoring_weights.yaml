# 评分权重配置
# 各维度权重总和 = 103（非100，各维度独立评分）
weights:
  和值: 18
  跨度: 15
  形态: 16    # 从12提高到16：实盘发现组三出现时30注全预测为组六（O1）
  奇偶: 8
  大小: 8
  012路: 7
  冷热: 10    # 提高冷热权重，重视冷号
  遗漏: 7     # 提高遗漏权重
  组三六偏向: 8
  多样性: 10  # 新增：组选多样性 + 跨度多样性

# 冷热参数
hot_cold:
  cold_threshold: 6    # 遗漏>6视为冷号（原来8）
  hot_threshold: 3     # 遗漏<=3视为热号

# 多样性参数
diversity:
  group_penalty: 5     # 同组选重复扣分
  span_spread: 5       # 跨度多样性加分（从8降到5：实盘发现多样性策略跨差4.0偏大 O8）

# 过热衰减（从0.6/0.8放宽到0.75/0.9：实盘发现衰减过于激进导致号码频繁掉出Top30又回归 O2）
overheat_decay:
  high: 0.75   # 近5期出现≥3次
  medium: 0.9  # 近5期出现≥2次
